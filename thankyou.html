<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="css/bootstrap.min.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	
	<title>Thank You | Bento</title>

	<style>
		body {
			font-family: 'Poppins', sans-serif;
			background: #f8f9fa;
		}

		.thankyou-section {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 40px 20px;
		}

		.thankyou-card {
			background: #161f48;
			padding: 50px 40px;
			border-radius: 12px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.08);
			max-width: 650px;
			width: 100%;
		}

		.thankyou-card h1 {
    font-weight: 600;
    margin-bottom: 20px;
    font-size: 50px;
    font-weight: 500;
    line-height: 60px;
    display: inline-block;
    background: -webkit-gradient(linear, left top, right top, from(#ff1e56), color-stop(#b06ab3), to(#00c6ff));
    background: -o-linear-gradient(left, #ff1e56, #b06ab3, #00c6ff);
    background: linear-gradient(3deg, #CCA14D, #FFED7E);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

		.thankyou-card p {
			color: #555;
			font-size: 16px;
			margin-bottom: 30px;
		}

		.btn-home {
			display: inline-block;
			padding: 12px 28px;
			background-color: #0d6efd;
			color: #fff;
			border-radius: 6px;
			text-decoration: none;
			font-weight: 500;
			transition: 0.3s ease;
		}

		.btn-home:hover {
			background-color: #084298;
			color: #fff;
		}

		.check-icon {
			font-size: 60px;
			color: #28a745;
			margin-bottom: 20px;
		}
	</style>
</head>
<body>
	<section class="thankyou-section">
		<div class="thankyou-card">
			<div class="align-items-center d-flex justify-content-center topbar">
<img src="image/gaurlogo.png" class="d-block img-fluid" alt="logo">

				
				
			</div>
		
			<h1>Thank You for Reaching Out!</h1>
	
			<p class="text-white">
				We’ve received your inquiry successfully.  
				Our team will review your details and get back to you within 24 hours.
			</p>
	
			<p class="text-white">
		
				Feel free to call us at  <a class="text-white" href="tel:9999991036" class="1phone-btn" style="color: #333;">9999991036</a>
				
			</p>
	
	
		</div>
	</section>

<script src="js/bootstrap.min.js"></script>

</body>
</html>
